# Base config - áp dụng cho tất cả profile. Override per-profile ở dưới (--- separator).
spring:
  application:
    name: job-tracker-ai
  # Tự load file .env ở root project (1 cấp trên backend/). optional: không fail nếu thiếu file
  # (prod deploy inject env vars qua OS/secret manager, không có file .env).
  config:
    import: optional:file:../.env[.properties] #tự đọc 
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # DB_PARAMS: query string tùy môi trường (mặc định rỗng). Neon/managed Postgres cần "?sslmode=require".
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobtracker}${DB_PARAMS:}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway quản lý schema, JPA chỉ validate match
    open-in-view: false    # tránh lazy loading trong view layer (anti-pattern)
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # cho phép apply lên DB đã có (vd: import dump)
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # SMTP — Spring Boot tự tạo JavaMailSender từ các key này (spring-boot-starter-mail).
  # Dev: dùng Mailtrap (inbox ảo, không gửi ra ngoài thật). Prod: SMTP thật.
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525} #${TÊN:mặc_định} = lấy biến môi trường, không có thì dùng giá trị mặc định. 
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB       # max single file (attachments)
      max-request-size: 12MB    # overhead cho multipart form

  jackson:
    serialization:
      write-dates-as-timestamps: false   # ISO-8601 strings, không epoch
      indent-output: false

server:
  # Cloud (Railway/Render) inject biến PORT và yêu cầu app bind đúng cổng đó; local mặc định 8080.
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never        # ẩn stack trace khỏi response, log thôi

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Custom application properties — bind qua @ConfigurationProperties
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY_SECONDS:900}
    refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:604800}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/callback}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
  encryption:
    key: ${ENCRYPTION_KEY:}
  mail:
    # Địa chỉ hiển thị ở dòng "From" của email hệ thống gửi đi.
    from: ${MAIL_FROM:Job Tracker AI <no-reply@jobtracker.ai>}
  storage:
    local-path: ${APP_STORAGE_LOCAL_PATH:${user.home}/job-tracker-uploads}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.jobtrackerai: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN

---
# DEV profile - verbose logging, dễ debug
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.jobtrackerai: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # show parameter binding

---
# TEST profile - chạy unit test (Mockito). Không cần DB thật.
# @SpringBootTest sẽ dùng profile này; Mockito tests không load full context nên không quan tâm.
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false             # test không apply migration
  jpa:
    hibernate:
      ddl-auto: none

---
# PROD profile - tối ưu performance, security
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

server:
  error:
    include-message: never
    include-binding-errors: never

management:
  health:
    redis:
      # Prod không chạy Redis (cache chưa dùng @Cacheable) → tắt indicator để /actuator/health không DOWN.
      enabled: false
    mail:
      # Render free chặn outbound SMTP port 25/465/587 → indicator thử nối SMTP sẽ treo
      # → /actuator/health timeout → Render đánh fail deploy. Gửi mail thật vẫn fail-soft trong MailService.
      enabled: false

logging:
  level:
    com.jobtrackerai: INFO
    # TẠM để INFO (không phải WARN) để thấy tiến trình khởi động trên Render:
    # "Bootstrapping JPA repositories", "HikariPool-1 - Starting", "Flyway migrating",
    # "Tomcat started on port", "Started BackendApplication in X seconds".
    # Với WARN thì log im lặng hoàn toàn → không biết startup kẹt ở đâu khi Render
    # kill vì port scan timeout. Hạ lại WARN sau khi deploy ổn định.
    org.springframework: INFO
    root: INFO
